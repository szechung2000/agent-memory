services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: memory
      POSTGRES_DB: agent_memory
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d agent_memory"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      AM_DATABASE_URL: postgresql+psycopg://memory:memory@db:5432/agent_memory
      AM_OPENAI_API_KEY: ${AM_OPENAI_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Opt-in, isolated PostgreSQL instance; no host port or persistent volume.
  test-db:
    profiles: [test]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: memory_test
      POSTGRES_PASSWORD: memory_test
      POSTGRES_DB: agent_memory_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory_test -d agent_memory_test"]
      interval: 2s
      timeout: 2s
      retries: 20

  integration:
    profiles: [test]
    build:
      context: .
      target: test
    environment:
      AM_TEST_PG_URI: postgresql+psycopg://memory_test:memory_test@test-db:5432/agent_memory_test
      AM_DATABASE_URL: postgresql+psycopg://memory_test:memory_test@test-db:5432/agent_memory_test
      AM_OPENAI_API_KEY: ""
    depends_on:
      test-db:
        condition: service_healthy
    command: ["pytest", "-q", "tests/test_pg_integration.py", "tests/test_pg_api_integration.py"]

volumes:
  pgdata:
