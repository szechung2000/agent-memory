services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: memory
      POSTGRES_DB: agent_memory
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d agent_memory"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      AM_DATABASE_URL: postgresql+psycopg://memory:memory@db:5432/agent_memory
      AM_OPENAI_API_KEY: ${AM_OPENAI_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
